# Deploys phazechat.world to Cloudflare Containers (cloudflare/wrangler.jsonc).
# Every push to master that touches the server, web client, Nova bot or the
# Worker builds nexus_server/Dockerfile and rolls the container over.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN    account API token from the "Edit Cloudflare
#                           Workers" template, scoped to this account
#   CLOUDFLARE_ACCOUNT_ID   the account the Worker lives in
# Until both exist the deploy job skips with a warning instead of failing.
# Full setup: cloudflare/README.md.

name: Deploy to Cloudflare

on:
  push:
    branches: [master]
    paths:
      - 'nexus_server/**'
      - 'web/**'
      - 'nova_bot/**'
      - 'cloudflare/**'
      - 'VERSION'
      - '.github/workflows/cloudflare-deploy.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

concurrency:
  # Never run two rollouts at once; a newer push waits for the current one.
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: worker-tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Check Cloudflare credentials
        id: creds
        working-directory: .
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::warning title=Cloudflare deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy (see cloudflare/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare/package-lock.json

      - run: npm ci --no-audit --no-fund
        if: steps.creds.outputs.ready == 'true'

      # wrangler builds the image with the runner's Docker, pushes it to the
      # account's registry and updates the Worker and container together.
      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
