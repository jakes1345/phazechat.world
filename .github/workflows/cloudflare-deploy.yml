# Deploys phazechat.world to Cloudflare Containers (cloudflare/wrangler.jsonc).
#
# Production deploys only run after "Phaze CI" (ci.yml) has passed on a push
# to master, and they deploy exactly the commit CI tested (its head_sha).
# If master has moved on by then, the deploy is skipped: the newer commit's
# own CI run deploys it once it passes. workflow_dispatch deploys the tip of
# the chosen branch (master) by hand.
#
# Pull requests that touch the Worker run its typecheck + tests only.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN    account API token from the "Edit Cloudflare
#                           Workers" template, scoped to this account
#   CLOUDFLARE_ACCOUNT_ID   the account the Worker lives in
# Until both exist the deploy job skips with a warning instead of failing.
# Full setup: cloudflare/README.md.

name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: ["Phaze CI"]
    types: [completed]
    branches: [master]
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

concurrency:
  # Never run two rollouts at once; a newer run waits for the current one.
  group: cloudflare-deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker-tests:
    # On workflow_run, only continue for a green CI run of a push to master
    # in this repository (not a PR from a fork whose branch is named master).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: worker-tests
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Check Cloudflare credentials
        id: creds
        working-directory: .
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::warning title=Cloudflare deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy (see cloudflare/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Runs queue up behind each other (concurrency above), so by the time
      # an older CI run's deploy starts, master may already be ahead.
      - name: Skip if master has moved past the tested commit
        id: fresh
        if: steps.creds.outputs.ready == 'true'
        working-directory: .
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          TIP="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [ -n "$TIP" ] && [ "$TIP" != "$TESTED_SHA" ]; then
            echo "::notice title=Deploy skipped::master is at $TIP, newer than the tested $TESTED_SHA; that commit's CI run will deploy it."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.fresh.outputs.deploy == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cloudflare/package-lock.json

      - run: npm ci --no-audit --no-fund
        if: steps.fresh.outputs.deploy == 'true'

      # wrangler builds the image with the runner's Docker, pushes it to the
      # account's registry and updates the Worker and container together.
      - name: Deploy
        if: steps.fresh.outputs.deploy == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
