name: Phaze CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: nexus_server/go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build server
        run: |
          cd nexus_server && go build -o ../phaze-nexus-linux .

      - name: Test suite
        run: |
          cd nexus_server && go test -race -count=1 -timeout 20m -v ./...

      - name: Go vet
        run: |
          cd nexus_server && go vet ./...

      - name: Web client (install, build, test, lint)
        run: |
          cd web && npm ci && npm run build && npm run test && npm run lint

      # Boots the built bundle in a real browser and asserts the app actually
      # mounts. Every check above inspects the code without running it, which
      # is how a react/react-dom mismatch shipped a blank page while CI stayed
      # green. Chromium only — this guards "does it start", not rendering
      # fidelity across browsers.
      - name: Install Playwright browser
        run: cd web && npx playwright install --with-deps chromium

      - name: Web smoke tests (real browser)
        run: cd web && npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # Compiles the Android app (release, with R8 shrinking, which is where a
  # missing keep rule shows up) and runs its unit tests. No signing: only the
  # APK packaging step needs the keystore, and this stops before it.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        # platform-tools only; Gradle's Android plugin fetches the platform
        # and build tools itself (see release.yml for why).
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Write local.properties (SDK path)
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # The Firebase config (google-services.json) only feeds push-notification
      # resources, not the code, so this check skips that one task rather than
      # depend on the release secret. Release builds still need the real file.
      - name: Compile, shrink and unit-test the release build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:minifyReleaseWithR8 -x :app:processReleaseGoogleServices --no-daemon
