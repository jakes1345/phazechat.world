AutoName: Phaze

Description: |-
  Phaze is a free, encrypted messaging app with voice, video, and group Spaces.

  Messages are end-to-end encrypted on your device before they're sent — the
  server stores ciphertext and cannot read them. Voice and video calls
  currently run through a Jitsi Meet room rather than a direct connection —
  see the privacy policy for what that means. Direct WebRTC is planned.

  Features:
  * End-to-end encrypted direct messages (NaCl/libsodium)
  * Voice and video calls with screen share
  * Group Spaces — text channels and voice rooms
  * Stories (24h photo/video posts)
  * File sharing up to 25MB
  * Push notifications
  * Cross-device sync with a Recovery PIN
  * Chat history import — upload a compatible export zip and messages appear in your DMs
  * 2FA / TOTP support
  * No ads, no tracking, no phone number required

  The server is open source and self-hostable with one Docker command. You
  don't have to trust phazechat.world — run your own relay.

AntiFeatures:
  NonFreeNet:
    - Uses Firebase Cloud Messaging (FCM) for push notifications

