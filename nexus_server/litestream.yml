# Litestream config: streams SQLite WAL frames to S3-compatible storage
# every second. On Cloudflare Containers the disk is wiped on every restart,
# so this replica (in R2) is the database's only durable copy.
#
# Required env vars at runtime (the Cloudflare Worker passes them through):
#   BUCKET_NAME             bucket name (LITESTREAM_BUCKET also accepted)
#   AWS_ENDPOINT_URL_S3     e.g. https://<account>.r2.cloudflarestorage.com
#   AWS_REGION              "auto" for R2
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# Restore by hand:
#   litestream restore -if-replica-exists -config /app/litestream.yml /data/nexus.db
#
# The entrypoint script (Dockerfile CMD) does this automatically when a
# bucket is set. If unset, the server runs without replication (useful for
# local dev / self-hosters who don't want S3).

dbs:
  - path: /data/nexus.db
    replicas:
      - type: s3
        bucket: ${BUCKET_NAME}
        path: nexus.db
        endpoint: ${AWS_ENDPOINT_URL_S3}
        region: ${AWS_REGION}
        access-key-id: ${AWS_ACCESS_KEY_ID}
        secret-access-key: ${AWS_SECRET_ACCESS_KEY}
        # Keep 24h of WAL + a snapshot every 6h. Tunable.
        retention: 168h
        retention-check-interval: 1h
        snapshot-interval: 6h
        sync-interval: 1s
